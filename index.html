<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiseToDo</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .hero {
      text-align: center;
      max-width: 480px;
    }
    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 27px;
      margin: 0 auto 20px;
      display: block;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .tagline {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 48px;
    }
    .tagline em {
      font-style: normal;
      color: #888;
    }
    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .links a.primary {
      background: #1c1c1e;
      color: #fff;
    }
    .links a.primary:hover {
      background: #3a3a3c;
    }
    .links a.secondary {
      background: #f0f0f2;
      color: #333;
    }
    .links a.secondary:hover {
      background: #e0e0e2;
    }
    footer {
      margin-top: 64px;
      color: #bbb;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="hero">
    <img class="app-icon" src="icon.png" alt="WiseToDo App Icon">
    <h1>WiseToDo</h1>
    <p class="tagline">说出来就对了<em> / Say it. Done.</em></p>
    <div class="links">
      <a class="secondary" href="privacy.html">隐私政策 / Privacy Policy</a>
      <a class="secondary" href="support.html">支持 / Support</a>
    </div>
  </div>

  <footer>
    &copy; 2026 WiseToDo &nbsp;·&nbsp; <a href="mailto:benjaminfaxpaper01@gmail.com" style="color:#bbb;">benjaminfaxpaper01@gmail.com</a>
  </footer>

</body>
</html>
